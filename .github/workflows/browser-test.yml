name: Browser Test

on:
  workflow_call:

jobs:
  browser-test:
    name: Run Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The browser binary is the slow part, and it only changes when
      # Playwright does — key the cache on the resolved lockfile.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-matrix-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browser matrix
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      # System deps are outside the cached browser directory, so they still
      # need installing on a cache hit.
      - name: Install system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - name: Run browser tests
        run: xvfb-run --auto-servernum npm run test:browser -- --browser.headless=false --no-file-parallelism

      - name: Run Chart cross-browser regressions
        run: |
          for browser in chromium firefox webkit; do
            xvfb-run --auto-servernum npm run test:browser:chart -- --project="$browser" --browser.headless=false --no-file-parallelism
          done

      - name: Run Chart GPU rendering regressions
        run: |
          for browser in chromium firefox webkit; do
            xvfb-run --auto-servernum npm run test:proof:chart -- --project="$browser" --browser.headless=false --no-file-parallelism
          done
